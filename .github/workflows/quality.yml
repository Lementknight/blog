name: Quality Checks

on:
  pull_request:
    branches:
      - main
  schedule:
    # Mondays 09:00 UTC - catches links that rot between PRs
    - cron: '0 9 * * 1'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  spelling:
    name: Spell check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: codespell-project/actions-codespell@v2
        # Settings live in .codespellrc

  links:
    name: Link check
    runs-on: ubuntu-latest
    # External sites are flaky; only fail the weekly/manual runs, not PRs
    continue-on-error: ${{ github.event_name == 'pull_request' }}
    steps:
      - uses: actions/checkout@v6
      - uses: lycheeverse/lychee-action@v2
        with:
          args: --config lychee.toml --no-progress 'content/**/*.md' SECURITY.md
          fail: true

  accessibility:
    name: Accessibility (pa11y)
    runs-on: ubuntu-latest
    env:
      HUGO_VERSION: 0.160.1
      PUPPETEER_SKIP_DOWNLOAD: '1'
      PUPPETEER_EXECUTABLE_PATH: /usr/bin/google-chrome
    steps:
      - uses: actions/checkout@v6
        with:
          submodules: recursive

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - uses: peaceiris/actions-hugo@v3
        with:
          hugo-version: ${{ env.HUGO_VERSION }}
          extended: true

      - name: Install JavaScript dependencies
        run: bun install --frozen-lockfile

      - name: Build site
        run: hugo --minify --environment production --baseURL "/" --destination public-a11y

      - name: Serve site and run pa11y
        run: |
          python3 -m http.server 8080 --directory public-a11y &
          sleep 2
          bun run test:a11y
