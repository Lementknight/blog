name: Quality Checks

# Spelling, linting, accessibility and the build run in Test Hugo Build (via Dagger).
# Link checking lives here because it needs the network and runs on a schedule.
on:
  pull_request:
    branches:
      - main
  schedule:
    # Mondays 09:00 UTC - catches links that rot between PRs
    - cron: '0 9 * * 1'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  links:
    name: Link check
    runs-on: ubuntu-latest
    # External sites are flaky; only fail the weekly/manual runs, not PRs
    continue-on-error: ${{ github.event_name == 'pull_request' }}
    steps:
      - uses: actions/checkout@v6
      - uses: dagger/dagger-for-github@v8.4.1
        with:
          version: "0.21.10"
          verb: call
          args: links
