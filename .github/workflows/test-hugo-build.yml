name: Test Hugo Build

# All checks run in Dagger (see .dagger/src/index.ts); reproduce locally with
#   dagger call ci --skip-links
on:
  pull_request:
    branches:
      - main
    paths:
      - 'content/**'
      - 'layouts/**'
      - 'themes/**'
      - 'static/**'
      - 'assets/**'
      - 'data/**'
      - 'i18n/**'
      - 'archetypes/**'
      - 'resources/**'
      - 'scripts/**'
      - '.dagger/**'
      - 'dagger.json'
      - 'hugo.yml'
      - 'hugo.yaml'
      - 'hugo.toml'
      - 'config.yml'
      - 'config.yaml'
      - 'config.toml'
      - 'go.mod'
      - 'go.sum'
      - 'package.json'
      - 'bun.lock'
      - 'SECURITY.md'
      - '.stylelintrc.json'
      - '.markdownlint-cli2.jsonc'
      - '.codespellrc'
      - 'lychee.toml'
      - '.pa11yci.json'
      - '.pa11yci-light.json'
      - '.github/workflows/test-hugo-build.yml'
      - '.github/workflows/firebase-hosting-pull-request.yml'
  push:
    branches:
      - test/*
      - ci/*
      - feature/*
      - develop
    paths:
      - 'content/**'
      - 'layouts/**'
      - 'themes/**'
      - 'static/**'
      - 'assets/**'
      - 'data/**'
      - 'i18n/**'
      - 'archetypes/**'
      - 'resources/**'
      - 'scripts/**'
      - '.dagger/**'
      - 'dagger.json'
      - 'hugo.yml'
      - 'hugo.yaml'
      - 'hugo.toml'
      - 'config.yml'
      - 'config.yaml'
      - 'config.toml'
      - 'go.mod'
      - 'go.sum'
      - 'package.json'
      - 'bun.lock'
      - 'SECURITY.md'
      - '.stylelintrc.json'
      - '.markdownlint-cli2.jsonc'
      - '.codespellrc'
      - 'lychee.toml'
      - '.pa11yci.json'
      - '.pa11yci-light.json'
      - '.github/workflows/test-hugo-build.yml'
      - '.github/workflows/firebase-hosting-pull-request.yml'

permissions:
  contents: read

jobs:
  test-build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          submodules: recursive  # Hugo theme

      - name: Lint, spell check, build, validate and accessibility test
        uses: dagger/dagger-for-github@v8.4.1
        with:
          version: "0.21.10"
          verb: call
          args: ci --skip-links
