baseURL: https://calebaguirreleon.com/
languageCode: en-us
title: Caleb Aguirre-Leon
theme: PaperMod
description: "Caleb Aguirre-Leon's website"

# Use relative URLs for better compatibility with preview deployments
relativeURLs: true
canonifyURLs: false

# Suppress raw HTML warning
ignoreLogs: ['warning-goldmark-raw-html']

markup:
  goldmark:
    renderer:
      unsafe: true

params:
  # Enable ADA compliant theme toggle
  disableThemeToggle: false
  author: ["Caleb Aguirre-Leon"]
  ShowCodeCopyButtons: true
  
  # Giscus comments configuration
  comments:
    giscus:
      repo: "Lementknight/blog"
      repoId: "R_kgDONw3w3A" # You'll need to get this from Giscus
      category: "General"
      categoryId: "DIC_kwDONw3w3M4CuwJI" # You'll need to get this from Giscus
      mapping: "specific"
      data-term: "title"
      reactionsEnabled: "1"
      emitMetadata: "0"
      theme: "preferred_color_scheme"
      lang: "en"


  assets:
    favicon: "favicon.ico"
    favicon16x16: "favicon-16x16.png"
    favicon32x32: "favicon-32x32.png"
    apple_touch_icon: "apple-touch-icon.png"
  profileMode:
    enabled: true
    # title: "Caleb Aguirre-Leon's Website" # optional default will be site title
    subtitle: "Hey there! 👋  \n In my blog I share my stories about my journey in software engineer ranging from my internships with Google and IBM to leading a dev team for my college's hackathon organization"
    imageUrl: "/images/profile.jpeg" # Static image - no compression
    imageTitle: "Caleb looking over to his left in front of a brick wall" # optional
    imageWidth: 300 # custom size
    imageHeight: 200 # custom size

  socialIcons: # optional
    - name: "GitHub"
      url: "https://github.com/Lementknight"
    - name: "linkedin"
      url: "https://www.linkedin.com/in/caleb-aguirre-leon/"
    - name: "unsplash"
      url: "https://flic.kr/ps/46EKnC"

menu:
  main:
    - name: Archive
      url: /archive/
      weight: 3
    - identifier: About Me
      name: About Me
      url: /aboutme/
      weight: 1
    - identifier: Blog
      name: Blog
      url: /posts/
      weight: 2
    - identifier: Contact
      name: Contact
      url: /contact/
      weight: 4