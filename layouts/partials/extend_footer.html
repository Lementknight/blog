{{- /* Enhanced ADA Compliant Theme Toggle */ -}}
{{- if (not site.Params.disableThemeToggle) }}
<script>
/* ADA Compliant Theme Toggle Enhancement */
document.addEventListener('DOMContentLoaded', function() {
    const themeToggle = document.getElementById('theme-toggle');
    if (!themeToggle) return;

    // Create screen reader announcement area
    const srOnly = document.createElement('div');
    srOnly.setAttribute('aria-live', 'polite');
    srOnly.setAttribute('aria-atomic', 'true');
    srOnly.className = 'sr-only';
    srOnly.style.cssText = 'position:absolute;width:1px;height:1px;padding:0;margin:-1px;overflow:hidden;clip:rect(0,0,0,0);white-space:nowrap;border:0;';
    document.body.appendChild(srOnly);

    // Function to update ARIA attributes and announce changes
    function updateThemeState(isDark) {
        const currentTheme = isDark ? 'dark' : 'light';
        const oppositeTheme = isDark ? 'light' : 'dark';
        
        // Update ARIA attributes
        themeToggle.setAttribute('aria-pressed', isDark.toString());
        themeToggle.setAttribute('aria-label', 'Switch to ' + oppositeTheme + ' theme. Current theme: ' + currentTheme);
        themeToggle.title = 'Switch to ' + oppositeTheme + ' theme (Alt + T)';
        
        // Announce change to screen readers
        srOnly.textContent = 'Switched to ' + currentTheme + ' theme';
        
        // Clear announcement after screen readers have had time to read it
        setTimeout(function() {
            srOnly.textContent = '';
        }, 1000);
    }

    // Initialize ARIA state based on current theme
    const isDarkMode = document.documentElement.dataset.theme === 'dark';
    updateThemeState(isDarkMode);

    // Enhanced click handler with accessibility features
    themeToggle.addEventListener('click', function(e) {
        // Don't prevent default - let original handler work
        const wasDark = document.documentElement.dataset.theme === 'dark';
        
        // Small delay to let original handler execute first
        setTimeout(function() {
            updateThemeState(!wasDark);
        }, 10);
    });

    // Enhanced keyboard support
    themeToggle.addEventListener('keydown', function(e) {
        // Support Enter and Space keys (standard for buttons)
        if (e.key === 'Enter' || e.key === ' ') {
            e.preventDefault();
            themeToggle.click();
        }
    });
});
</script>
{{- end }}

{{- /* Material-style icon copy button for code blocks */ -}}
<script>
document.addEventListener('DOMContentLoaded', function() {
    const COPY_SVG = '<svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="9" y="9" width="13" height="13" rx="2" ry="2"></rect><path d="M5 15H4a2 2 0 0 1-2-2V4a2 2 0 0 1 2-2h9a2 2 0 0 1 2 2v1"></path></svg>';
    const CHECK_SVG = '<svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><polyline points="20 6 9 17 4 12"></polyline></svg>';

    document.querySelectorAll('pre > code').forEach((code) => {
        const pre = code.parentNode;
        const container = pre.parentNode;
        // Pick the element that will host the absolutely-positioned button.
        // For Chroma-highlighted blocks that's .highlight; otherwise the <pre> itself.
        const host = container.classList.contains('highlight') ? container : pre;
        if (host.querySelector(':scope > .copy-code')) return;
        if (getComputedStyle(host).position === 'static') host.style.position = 'relative';

        const btn = document.createElement('button');
        btn.type = 'button';
        btn.className = 'copy-code';
        btn.setAttribute('aria-label', 'Copy code to clipboard');
        btn.innerHTML = COPY_SVG;

        btn.addEventListener('click', async function() {
            try {
                await navigator.clipboard.writeText(code.textContent);
                btn.innerHTML = CHECK_SVG;
                btn.classList.add('copied');
                btn.setAttribute('aria-label', 'Copied');
                setTimeout(function() {
                    btn.innerHTML = COPY_SVG;
                    btn.classList.remove('copied');
                    btn.setAttribute('aria-label', 'Copy code to clipboard');
                }, 2000);
            } catch (e) {
                /* clipboard blocked — leave icon unchanged */
            }
        });

        host.appendChild(btn);
    });
});
</script>

{{- /* ADA Compliant Back-to-Top Button Enhancement */ -}}
<script>
document.addEventListener('DOMContentLoaded', function() {
    const topLink = document.getElementById('top-link');
    if (!topLink) return;

    function updateTopLinkAccessibility() {
        const isVisible = getComputedStyle(topLink).visibility === 'visible';
        topLink.setAttribute('tabindex', isVisible ? '0' : '-1');
        topLink.setAttribute('aria-hidden', isVisible ? 'false' : 'true');
    }

    topLink.setAttribute('role', 'button');
    topLink.setAttribute('aria-label', 'Go back to top of page');
    updateTopLinkAccessibility();

    const observer = new MutationObserver(updateTopLinkAccessibility);
    observer.observe(topLink, { attributes: true, attributeFilter: ['style', 'class'] });

    topLink.addEventListener('keydown', function(e) {
        if (e.key === 'Enter' || e.key === ' ') {
            e.preventDefault();
            window.scrollTo({ top: 0, behavior: 'smooth' });
            const topElement = document.getElementById('top') || document.body;
            topElement.setAttribute('tabindex', '-1');
            topElement.focus();
        }
    });
});
</script>
